services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: animes
      POSTGRES_PASSWORD: animes
      POSTGRES_DB: animes
    ports:
      - "5432:5432"
    volumes:
      - animes_pg:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animes -d animes"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,s3
      AWS_DEFAULT_REGION: us-east-1

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://animes:animes@postgres:5432/animes
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/anime-events
      SQS_QUEUE_NAME: anime-events
      S3_ENDPOINT: http://localstack:4566
      S3_BUCKET: animes-covers
      S3_PUBLIC_BASE_URL: http://localhost:4566/animes-covers
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started

volumes:
  animes_pg:
